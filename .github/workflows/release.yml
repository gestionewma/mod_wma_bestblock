name: Build Joomla Release ZIP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Extension ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "mod_wma_bestblock-${TAG}.zip" . -x "*.git*" ".github/*"
          cp "mod_wma_bestblock-${TAG}.zip" mod_wma_bestblock.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mod_wma_bestblock-${{ github.ref_name }}.zip
            mod_wma_bestblock.zip
